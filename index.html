let sortCol=null, sortDir=1;
function sortBy(col){
  if(sortCol===col)sortDir*=-1; else{sortCol=col;sortDir=1;}
  document.querySelectorAll('th').forEach(t=>t.classList.remove('asc','desc'));
  document.querySelectorAll('th').forEach(t=>{
    if(t.getAttribute('onclick')===`sortBy('${col}')`)t.classList.add(sortDir===1?'asc':'desc');
  });
  render();
}

function salesNum(s){ // parse "50+", "4000+" etc. to number for sorting
  return parseInt(s.replace(/[^0-9]/g,''))||0;
}

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const cat=document.getElementById('cat').value;
  const minMulti=parseFloat(document.getElementById('multi').value)||0;
  const salesSrc=document.getElementById('salesSrc').value;

  let rows=P.filter(p=>{
    const [id,cn,en,category,uk,cnp,ver,rank,bsrCat,comp,note,asin,kw,sNum,sSrc]=p;
    if(cat&&category!==cat)return false;
    if(minMulti&&uk/cnp<minMulti)return false;
    if(salesSrc==='amz'&&sSrc!=='amz')return false;
    if(q&&!cn.toLowerCase().includes(q)&&!en.toLowerCase().includes(q)&&!category.toLowerCase().includes(q))return false;
    return true;
  });

  if(sortCol){
    rows.sort((a,b)=>{
      const [aid,acn,aen,acat,auk,acnp,aver,arank,,,,,,asNum]=a;
      const [bid,bcn,ben,bcat,buk,bcnp,bver,brank,,,,,,bsNum]=b;
      let av,bv;
      switch(sortCol){
        case 'id':av=aid;bv=bid;break;
        case 'cn':av=acn;bv=bcn;break;
        case 'en':av=aen;bv=ben;break;
        case 'cat':av=acat;bv=bcat;break;
        case 'uk':av=auk;bv=buk;break;
        case 'cn_p':av=acnp;bv=bcnp;break;
        case 'multi':av=auk/acnp;bv=buk/bcnp;break;
        case 'margin':av=(auk-acnp)/auk;bv=(buk-bcnp)/buk;break;
        case 'sales':av=salesNum(asNum);bv=salesNum(bsNum);break;
        case 'rank':av=arank;bv=brank;break;
        default:av=aid;bv=bid;
      }
      if(typeof av==='string')return sortDir*av.localeCompare(bv);
      return sortDir*(av-bv);
    });
  }

  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  let totalMulti=0,hiCount=0;

  rows.forEach(p=>{
    const [id,cn,en,category,uk,cnp,ver,rank,bsrCat,comp,note,asin,kw,sNum,sSrc]=p;
    const multi=uk/cnp;
    const margin=((uk-cnp)/uk*100).toFixed(0);
    totalMulti+=multi;
    if(multi>=6)hiCount++;

    const mClass=multi>=8?'multi-hi':multi>=6?'multi-md':'multi-lo';
    const margClass=margin>=80?'m-hi':margin>=70?'m-md':'m-lo';
    const verUK='<span class="ver-uk">✓UK</span>';
    const verCN=ver==='v'?'<span class="ver-cn-ok">✓CN</span>':'<span class="ver-cn-est">est</span>';
    const salesHtml=sSrc==='amz'
      ?`<span class="sales-amz">${sNum}/月</span><span class="sales-amz-badge">AMZ</span>`
      :`<span class="sales-est">${sNum}/月</span><span class="sales-est-badge">est</span>`;

    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td class="col-id" style="color:#444">${id}</td>
      <td class="col-cn">${cn}</td>
      <td class="col-en" title="${en}">${en}</td>
      <td class="col-cat"><span class="cat-${category}">${category}</span></td>
      <td class="col-ukprice" style="color:#e0e0e0;font-weight:600">£${uk.toFixed(2)}</td>
      <td class="col-cnprice" style="color:#aaa">£${cnp.toFixed(2)}</td>
      <td class="col-ver">${verUK}<br>${verCN}</td>
      <td class="col-multi"><span class="${mClass}">${multi.toFixed(1)}x</span></td>
      <td class="col-margin"><span class="${margClass}">${margin}%</span></td>
      <td class="col-sales">${salesHtml}</td>
      <td class="col-rank"><span class="rank-badge">#${rank}</span>${bsrCat}</td>
      <td class="col-comp"><span class="comp-badge c-${comp}">${comp}</span></td>
      <td class="col-amz"><a class="link-amz" href="${amzUrl(asin)}" target="_blank">AMZ↗</a></td>
      <td class="col-1688"><a class="link-1688" href="${URLS_1688[id-1]}" target="_blank">1688↗</a></td>
      <td class="col-note" title="${note}">${note}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('s-count').textContent=rows.length;
  document.getElementById('s-avg').textContent=rows.length?(totalMulti/rows.length).toFixed(1)+'x':'—';
  document.getElementById('s-hi').textContent=hiCount;
}

  const h=['#','中文名','英文名','类目','UK售价(£)','进货价(£)','CN价验证','倍数','毛利率%','月销量','月销数据源','畅销榜排名','子类目','竞争度','Amazon链接','1688链接','备注'];
  const rows=P.map(([id,cn,en,cat,uk,cnp,ver,rank,bsrCat,comp,note,asin,kw,sNum,sSrc])=>{
    return[id,`"${cn}"`,`"${en}"`,cat,uk,cnp,ver==='v'?'已验证':'估算',(uk/cnp).toFixed(1)+'x',((uk-cnp)/uk*100).toFixed(0)+'%',sNum,sSrc==='amz'?'Amazon实数':'推算',`#${rank}`,`"${bsrCat}"`,comp,amzUrl(asin),URLS_1688[id-1],`"${note}"`].join(',');
  });
  const csv=[h.join(','),...rows].join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='product-research-uk.csv';
  a.click();
}

render();
</script>
</body>
